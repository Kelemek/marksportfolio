name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Placeholder values for build; real credentials only needed at runtime
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: portfolio-next/package-lock.json

      - name: Install dependencies
        run: |
          cd portfolio-next
          npm ci

      - name: Lint
        run: npm run lint --prefix portfolio-next

      - name: Test
        run: npm run test --prefix portfolio-next -- --run

      - name: Build
        run: npm run build --prefix portfolio-next
