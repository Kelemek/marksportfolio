name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: portfolio-next/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix portfolio-next

      - name: Lint
        run: npm run lint --prefix portfolio-next

      - name: Test
        run: npm run test --prefix portfolio-next -- --run

      - name: Build
        run: npm run build --prefix portfolio-next
