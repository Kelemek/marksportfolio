name: Daily Database Backup (API Method)

on:
  schedule:
    - cron: '0 8 * * *' # daily at 08:00 UTC (adjust as needed)
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd portfolio-next || true
          npm ci --silent || npm install --no-audit --no-fund

      - name: Run backup script
        working-directory: portfolio-next
        run: |
          mkdir -p backups
          node ../scripts/backup-database-json.js

      - name: Upload backups as artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup
          path: portfolio-next/backups/*.json.gz
