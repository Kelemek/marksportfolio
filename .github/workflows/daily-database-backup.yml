name: Daily Database Backup (API Method)

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: portfolio-next/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix portfolio-next

      - name: Run backup script
        run: |
          mkdir -p portfolio-next/backups
          node scripts/backup-database-json.js

      - name: Upload backups as artifact
        uses: actions/upload-artifact@v6
        with:
          name: supabase-backup
          path: portfolio-next/backups/*.json.gz
